name: pages

# The docs site: docs/ with the README as its home page, built by MkDocs
# (mkdocs.yml, scripts/pages_hooks.py) and served at
# https://skill-plus-plus-org.github.io/. Every PR builds it, so a broken link
# fails there; only main deploys it.
#
# The org's root address is served only from the repo named after it, so the
# built site is pushed to skill-plus-plus-org/skill-plus-plus-org.github.io,
# whose Pages serves its main branch. Set up once:
#   - that repo, Settings → Deploy keys: the public key, with write access
#   - this repo, Settings → Secrets → Actions: PAGES_DEPLOY_KEY, the private key
#   - that repo, Settings → Pages: Source "Deploy from a branch", main, / (root)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in the order they were pushed.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_REPO: skill-plus-plus-org/skill-plus-plus-org.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MkDocs 2.0 drops the plugin system Material is built on.
      - run: python -m pip install --quiet "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - name: Build, failing on any broken link
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://skill-plus-plus-org.github.io/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/
      # The site repo holds only the latest build: one commit, replaced each
      # time, naming the commit here it was built from.
      - name: Push the site to ${{ env.SITE_REPO }}
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "PAGES_DEPLOY_KEY is not set (see the top of this file)"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd site
          touch .nojekyll   # serve the files as built; Jekyll would skip some
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push --force "git@github.com:${SITE_REPO}.git" main
