name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # For the two tests that run the review page's JavaScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No model anywhere in CI: the suite stubs the judge, the embeddings,
      # the describer and naming, and the leak guard is pattern matching.
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Leak guard
        run: python scripts/leak_guard.py
      - name: Package builds and installs
        run: |
          python -m pip install --quiet .
          skill-plus-plus --version

  # The package as a release builds it, checked on every PR so the first
  # upload is not where a broken README or a missing file shows up.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, with the README's links made absolute for PyPI
        run: |
          # readme-renderer[md] is what makes twine check render Markdown at all
          python -m pip install --quiet build twine "readme-renderer[md]"
          python scripts/pypi_readme.py --in-place
          python -m build
      - name: PyPI will render the README
        run: python -m twine check --strict dist/*
      - name: The wheel holds the package, its prompts and its commands, and nothing else
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for folder in ("prompts", "commands"):
              assert any(n.startswith(f"skill_plus_plus/{folder}/") for n in names), f"{folder} missing"
          stray = [n for n in names if not n.startswith("skill_plus_plus")]
          assert not stray, stray
          PY
